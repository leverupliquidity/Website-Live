[build]
  # npm run build = astro build, then scripts/guard.mjs. A guard failure exits 1 and stops the deploy.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Testing tools (Playwright) are not needed on Netlify; skip their browser download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# 301 redirects from the old site
[[redirects]]
  from = "/funding"
  to = "/financing"
  status = 301
  force = true

[[redirects]]
  from = "/funding.html"
  to = "/financing"
  status = 301
  force = true

# Old site's separate phone homepage
[[redirects]]
  from = "/index-mobile*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/funding/*"
  to = "/financing"
  status = 301
  force = true

# Retired Oct 2026 (Phase 1 purge): deal-mechanics guide. Exact paths only, one hop to /guides.
[[redirects]]
  from = "/guides/factor-rate-vs-apr"
  to = "/guides"
  status = 301
  force = true

[[redirects]]
  from = "/guides/factor-rate-vs-apr/"
  to = "/guides"
  status = 301
  force = true


[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
